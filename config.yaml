# D&D Ursina Adventure - Configuration File

# Game Settings
game:
  title: "Lost Mines of Phandelver"
  version: "1.0.0"
  window_size: [1280, 720]
  fullscreen: false
  fps: 60
  debug: false

# Character Settings
character:
  default_level: 1
  default_experience: 0
  hit_die: "d8"

# Combat Settings
combat:
  enable_critical_hits: true
  critical_threshold: 20
  initiative_modifier: "dex"
  encounter_difficulty: "medium"

# Audio Settings
audio:
  master_volume: 0.8
  music_volume: 0.6
  sfx_volume: 0.8
  enable_music: true

# Graphics Settings
graphics:
  shadow_quality: "medium"
  draw_distance: 100
  particle_effects: true
  ambient_light: 0.5
